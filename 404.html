<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>此处无茶 · 薰风斋</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1f1c19">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%239c342a'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='%23fff' font-family='serif'%3E薰%3C/text%3E%3C/svg%3E">
<style>
  /* 自包含：404 可能被任意深度的路径命中，不依赖外部样式表 */
  body{margin:0;min-height:100vh;display:grid;place-items:center;text-align:center;
    background:linear-gradient(165deg,#17120d,#2a2018 70%,#35281d);color:#f2ece0;
    font-family:"Songti SC","STSong","Noto Serif SC","SimSun",Georgia,serif;
    letter-spacing:.04em;padding:40px 24px;position:relative;overflow:hidden}
  body::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 60% 55% at 50% 55%,rgba(168,135,79,.16),transparent 70%)}
  .inner{position:relative;z-index:2}
  .en{font-size:.68rem;letter-spacing:.5em;color:#8d7f6a;text-transform:uppercase;margin:0 0 22px}
  h1{font-size:clamp(2rem,6vw,3rem);letter-spacing:.42em;text-indent:.42em;margin:0 0 18px;font-weight:500}
  .kicker{font-family:"Kaiti SC","STKaiti",serif;color:#b8a88e;letter-spacing:.3em;margin:0 0 36px}
  a{color:#d8c9ae;text-decoration:none;border-bottom:1px solid #9c342a;padding-bottom:4px;letter-spacing:.2em}
  a:hover{color:#f2ece0}
  .bowl{width:120px;margin:0 auto 34px;opacity:.75}
</style>
</head>
<body>
  <div class="inner">
    <svg class="bowl" viewBox="0 0 320 250" aria-hidden="true">
      <ellipse cx="160" cy="96" rx="104" ry="25" fill="#0b0908" stroke="#6c5b45" stroke-width="2"/>
      <path d="M56 96l28 76c3.6 9.6 34 15 76 15s72.4-5.4 76-15l28-76" fill="#15100c" stroke="#6c5b45" stroke-width="2"/>
      <ellipse cx="160" cy="96" rx="95" ry="21" fill="none" stroke="#3b3128" stroke-width="2" stroke-dasharray="6 9"/>
    </svg>
    <p class="en">404 · Not Found</p>
    <h1>此 处 无 茶</h1>
    <p class="kicker">所寻之页，如汤上浮沫，须臾已散</p>
    <p><a id="home" href="index.html">← 回 薰 风 斋</a></p>
  </div>
<script>
  /* 兼容两种部署：根域名 → "/"；GitHub 项目页 → "/<仓库名>/" */
  (function () {
    var seg = location.pathname.split('/').filter(Boolean);
    var isProjectPage = /\.github\.io$/i.test(location.hostname) && seg.length > 0;
    document.getElementById('home').href = isProjectPage ? '/' + seg[0] + '/' : '/';
  })();
</script>
</body>
</html>
